name: Linux host

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  headless-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libssl-dev python3-venv
      - name: Configure
        run: cmake --preset linux-release
      - name: Build
        run: cmake --build --preset linux-release
      - name: Test
        run: ctest --preset linux-release
      - name: Validate optional Bleak environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tools/requirements-mi-ble.txt
          .venv/bin/python -c "import bleak"
